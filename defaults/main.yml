---

# Location where you want to store the mirrored files
apt_mirror_root: /data/install/ubuntu

# APT packages to install
apt_mirror_packages:
  - apt-mirror

# Ubuntu releases to mirror
apt_mirror_releases:
  - jammy
  - noble

# Ubuntu releases supported
apt_mirror_releases:
  - focal
  - jammy
  - noble
  - resolute

# Schedule mirror job
apt_mirror_schedule: false
